services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: plurijob-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: PluriJob
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: K1k@k0kA
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PluriJob"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    network_mode: host
    build:
      context: ./backend
    container_name: plurijob-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: K1k@k0kA
      POSTGRES_DB: PluriJob
      PROJECT_NAME: PluriJob API
      API_V1_STR: /api/v1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
