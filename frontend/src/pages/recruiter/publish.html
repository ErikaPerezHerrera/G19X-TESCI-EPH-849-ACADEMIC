<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PluriJob - Publicar Vacante</title>
  <!-- CDN Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CDN Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <!-- Navegación Superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="jobs.html">PluriJob</a>
      <span class="navbar-text text-light">Panel de Reclutador</span>
    </div>
  </nav>

  <!-- Contenedor Principal -->
  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <a href="jobs.html" class="btn btn-outline-secondary">
          <i class="bi"></i> Volver a vacantes
        </a>
        </div>
        </div>
        
        <div class="card shadow-sm border-0">
          <div class="card-header bg-primary text-white py-3">
            <h4 class="card-title mb-0 fs-5"><i class="bi bi-briefcase-fill me-2"></i>Crear Nueva Vacante</h4>
          </div>
          <div class="card-body p-4">
            
            <form id="publishJobForm">
              
              <!-- Título de la Vacante -->
              <div class="mb-3">
                <label for="jobTitle" class="form-label fw-semibold">Título del Puesto *</label>
                <input type="text" class="form-control" id="jobTitle" placeholder="Ej. Desarrollador Backend Python Senior" required>
              </div>

              <div class="row g-3 mb-3">
                <!-- Área Profesional -->
                <div class="col-md-6">
                  <label for="jobArea" class="form-label fw-semibold">Área o Departamento *</label>
                  <input type="text" class="form-control" id="jobArea" placeholder="Ej. Tecnología / TI" required>
                </div>
                
                <!-- Tipo de Perfil -->
                <div class="col-md-6">
                  <label for="profileType" class="form-label fw-semibold">Tipo de Perfil *</label>
                  <input type="text" class="form-control" id="profileType" placeholder="Ej. Ingeniería de Software" required>
                </div>
              </div>

              <div class="row g-3 mb-3">
                <!-- Modalidad -->
                <div class="col-md-6">
                  <label for="jobModality" class="form-label fw-semibold">Modalidad *</label>
                  <select class="form-select" id="jobModality" required>
                    <option value="" selected disabled>Selecciona modalidad...</option>
                    <option value="remoto">Remoto</option>
                    <option value="presencial">Presencial</option>
                    <option value="hibrido">Híbrido</option>
                  </select>
                </div>

                <!-- Ubicación -->
                <div class="col-md-6">
                  <label for="jobLocation" class="form-label fw-semibold">Ubicación</label>
                  <input type="text" class="form-control" id="jobLocation" placeholder="Ej. Ciudad de México, MX (Opcional si es remoto)">
                </div>
              </div>

              <!-- Descripción -->
              <div class="mb-3">
                <label for="jobDescription" class="form-label fw-semibold">Descripción del Puesto *</label>
                <textarea class="form-control" id="jobDescription" rows="5" placeholder="Detalla las responsabilidades principales, misión del rol y propuesta de valor..." required></textarea>
              </div>

              <!-- Habilidades Técnicas -->
              <div class="mb-3">
                <label for="technicalSkills" class="form-label fw-semibold">Habilidades Técnicas (Separadas por coma) *</label>
                <input type="text" class="form-control" id="technicalSkills" placeholder="Ej. Python, FastAPI, PostgreSQL, Git" required>
                <div class="form-text">La IA usará estas habilidades para calcular el porcentaje de compatibilidad con los candidatos.</div>
              </div>

              <!-- Habilidades Blandas -->
              <div class="mb-3">
                <label for="softSkills" class="form-label fw-semibold">Habilidades Blandas (Separadas por coma) *</label>
                <input type="text" class="form-control" id="softSkills" placeholder="Ej. Responsabilidad, Comunicación, Trabajo en equipo" required>
              </div>

              <!-- Fecha Límite -->
              <div class="mb-4">
                <label for="jobDeadline" class="form-label fw-semibold">Fecha Límite de Recepción</label>
                <input type="datetime-local" class="form-control" id="jobDeadline">
                <div class="form-text">Debe ser una fecha futura. Déjalo en blanco si no tiene fecha de expiración.</div>
              </div>

              <!-- Botones de Acción -->
              <div class="d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-outline-secondary">Limpiar</button>
                <button type="submit" class="btn btn-primary px-4">
                  <i class="bi bi-send-fill me-2"></i>Publicar Vacante
                </button>
              </div>

            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- JS de Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js/auth.js"></script>
  <script src="../../js/guard.js"></script>
  <!-- Controlador JavaScript de la vista -->
  <script type="module" src="../../js/views/publish_job.js"></script>
</body>
</html>
