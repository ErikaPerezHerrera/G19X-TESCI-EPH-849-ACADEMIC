 <!--Vacantes activas y lista de candidatos ordenados-->
 <!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PluriJob - Gestión de Vacantes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">PluriJob <span class="badge bg-primary fs-6">Reclutador</span></a>
      <div class="d-flex align-items-center gap-3">
        <a href="publish.html" class="btn btn-primary">
          <i class="bi bi-plus-lg"></i> Publicar Vacante
        </a>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2>Gestión de Vacantes</h2>
    </div>

    <!-- Pestañas: Activas / Cerradas -->
    <ul class="nav nav-tabs mb-4" id="jobsTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="active-tab" data-bs-toggle="tab" data-bs-target="#active-jobs" type="button" role="tab">
          Vacantes Activas
        </button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="closed-tab" data-bs-toggle="tab" data-bs-target="#closed-jobs" type="button" role="tab">
          Vacantes Cerradas
        </button>
      </li>
    </ul>

    <div class="tab-content" id="jobsTabsContent">
      <!-- Contenedor Vacantes Activas -->
      <div class="tab-pane fade show active" id="active-jobs" role="tabpanel">
        <div id="activeJobsList" class="row g-3">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando vacantes...</p>
          </div>
        </div>
      </div>

      <!-- Contenedor Vacantes Cerradas -->
      <div class="tab-pane fade" id="closed-jobs" role="tabpanel">
        <div id="closedJobsList" class="row g-3">
          <div class="text-center py-5">
            <p class="text-muted">No hay vacantes cerradas.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Candidatos de una Vacante -->
  <div class="modal fade" id="candidatesModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="candidatesModalTitle">Candidatos Postulados</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body bg-light">
          <div id="candidatesList" class="d-flex flex-column gap-3">
            <!-- Se llena dinámicamente con JS -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Detalle del CV del Candidato -->
  <div class="modal fade" id="cvDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="cvCandidateName">Detalle del Candidato</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="cvDetailBody">
          <!-- Contenido del CV cargado dinámicamente -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../js/views/dashboard_recruiter.js"></script>
</body>u
</html>
