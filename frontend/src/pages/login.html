<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PluriJob - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center vh-100 py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        
        <!-- Tarjeta de Login -->
        <div class="card shadow-sm border-0 mb-3">
          <div class="card-body p-4 text-center">
            <h3 class="fw-bold text-primary mb-1">PluriJob</h3>
            <p class="text-muted small mb-4">Ingresa tus credenciales para continuar</p>

            <form id="loginForm">
              <div class="text-start mb-3">
                <label for="loginEmail" class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="usuario@ejemplo.com" required>
              </div>

              <div class="text-start mb-4">
                <label for="loginPassword" class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
              </button>
            </form>

            <div class="border-top pt-3 text-center small">
              <span class="text-muted">¿No tienes una cuenta aún?</span>
              <a href="signup.html" class="fw-semibold text-primary text-decoration-none">Regístrate aquí</a>
            </div>

          </div>
        </div>

        <!-- Apartado / Aviso para Usuario Casual -->
        <div class="alert alert-info border-0 shadow-sm d-flex align-items-center gap-3 p-3 mb-0" role="alert">
          <i class="bi bi-info-circle-fill fs-3 text-info flex-shrink-0"></i>
          <div class="small">
            <strong class="d-block mb-1">¿Estás explorando ofertas de empleo?</strong>
            No necesitas iniciar sesión para buscar vacantes. Puedes ver las ofertas disponibles y postularte subiendo tu CV en <a href="index.html" class="alert-link">nuestro Portal Principal</a>.
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
