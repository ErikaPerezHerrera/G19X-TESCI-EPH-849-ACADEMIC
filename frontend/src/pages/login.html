<!-- # Inicio de Sesión / Google OAuth -->
 <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PluriJob - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        
        <div class="card shadow-sm border-0">
          <div class="card-body p-4 text-center">
            <h3 class="fw-bold text-primary mb-1">PluriJob</h3>
            <p class="text-muted small mb-4">Ingresa tus credenciales para continuar</p>

            <form id="loginForm">
              <div class="text-start mb-3">
                <label for="loginEmail" class="form-label fw-semibold">Correo Electrónico</label>
                <input type="email" class="form-control" id="loginEmail" placeholder="reclutador@ejemplo.com" required>
              </div>

              <div class="text-start mb-4">
                <label for="loginPassword" class="form-label fw-semibold">Contraseña</label>
                <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
              </button>
            </form>

          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/auth.js"></script>
</body>
</html>
